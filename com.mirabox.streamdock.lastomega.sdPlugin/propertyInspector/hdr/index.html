<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Last Omega — HDR</title>
  <link rel="stylesheet" href="../../static/css/sdpi.css" />
</head>
<body>
  <div class="sdpi-wrapper" style="display: none;">
    <div class="sdpi-item">
      <div class="sdpi-item-label">Display</div>
      <select class="sdpi-item-value select" id="nameFilter">
        <option value="MO32U2">MO32U2</option>
      </select>
    </div>

    <div type="select" class="sdpi-item">
      <div class="sdpi-item-label">Mode</div>
      <select class="sdpi-item-value select" id="mode">
        <option value="toggle">Toggle</option>
        <option value="on">HDR On</option>
        <option value="off">HDR Off</option>
      </select>
    </div>

    <div class="sdpi-item">
      <div class="sdpi-item-label">Status</div>
      <div class="sdpi-item-value" id="statusText">—</div>
    </div>

    <div class="sdpi-item">
      <div class="sdpi-item-label">Actions</div>
      <button class="sdpi-item-value" id="btnRefresh">Refresh</button>
    </div>

    <div class="sdpi-item">
      <div class="sdpi-item-label"></div>
      <button class="sdpi-item-value" id="btnOn">HDR On</button>
    </div>

    <div class="sdpi-item">
      <div class="sdpi-item-label"></div>
      <button class="sdpi-item-value" id="btnOff">HDR Off</button>
    </div>
  </div>

  <script src="../utils/common.js"></script>
  <script src="../utils/action.js"></script>
  <script src="./index.js"></script>
</body>
</html>
